<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Veredas: entardecer sobre caminhos que se encontram -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a2e"/>
      <stop offset="1" stop-color="#06171f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="0.15" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#1fb978" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1fb978" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#0b6b80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b6b80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <rect width="1920" height="1080" fill="url(#green)"/>
  <rect width="1920" height="1080" fill="url(#teal)"/>

  <!-- caminhos (veredas) convergindo no horizonte -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path stroke-opacity="0.10" stroke-width="3" d="M-40 1080 C 400 900, 760 640, 960 500"/>
    <path stroke-opacity="0.07" stroke-width="3" d="M 240 1080 C 560 880, 820 660, 960 500"/>
    <path stroke-opacity="0.10" stroke-width="3" d="M1960 1080 C 1520 900, 1160 640, 960 500"/>
    <path stroke-opacity="0.07" stroke-width="3" d="M1680 1080 C 1360 880, 1100 660, 960 500"/>
  </g>
  <circle cx="960" cy="440" r="34" fill="#ffc152" fill-opacity="0.85"/>
</svg>
